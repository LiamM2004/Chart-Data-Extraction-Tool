[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chartx"
version = "0.1.0"
description = "Extract data from photos of charts"
requires-python = ">=3.10,<3.14"   # paddlepaddle has no wheel for 3.14 yet
dependencies = [
    # contrib, not opencv-python: PaddleOCR pins this exact version. Never install both,
    # they share the same cv2 folder and overwrite each other
    "opencv-contrib-python==4.10.0.84",
    "numpy",
    "paddleocr==3.7.0",    # reads the labels in pie charts (chartx/detection/pie_graph.py)
    "paddlepaddle==3.3.1", # the engine PaddleOCR runs on
    "matplotlib",  # used by the exploration notebook (chartx/preprocessing/whiteboard_clean.ipynb)
    "pytesseract",  # reads the axis labels; needs the tesseract binary too (see the README)
]

[tool.setuptools.packages.find]
include = ["chartx*"]
