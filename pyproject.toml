[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chartx"
version = "0.1.0"
description = "Extract data from photos of charts"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "numpy",
    "matplotlib",  # used by the exploration notebook (chartx/preprocessing/whiteboard_clean.ipynb)
]

[tool.setuptools.packages.find]
include = ["chartx*"]
