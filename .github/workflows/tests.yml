name: tests

# Run the tests on every pull request, and on every push to main so main stays green.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the oldest that pyproject.toml allows; 3.14 is the version used for development so far.
        # Add any other version the team actually uses.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the system library OpenCV needs
        run: sudo apt-get update && sudo apt-get install -y libgl1

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install "opencv-python==5.0.0.93"      # the OpenCV the thresholds were tuned on
          pip install -e .

      - name: Run the tests
        run: python -m unittest discover tests -v
